# Service Approval — CI pipeline
#
# Four gates that must pass on every MR before merge:
#   1. Unit tests — 280+ Python tests in tools/validate/ + tools/evidence/
#   2. Sync drift — tools/sync-ide-configs.py --check must show no drift
#      AND tools/generate-kiro-agents.py --check must show no drift
#      (agent mirrors regenerated from agents-src/*.yaml)
#   3. Install check — install.sh --check must complete without errors
#   4. Schema validity — every schema in schemas/ parses as Draft 2020-12
#
# Headless service-approval runs (actually generating controls) are out of
# scope here; add a scheduled job if you want that.

stages:
  - verify

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet pyyaml jsonschema pytest

unit-tests:
  stage: verify
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet pyyaml jsonschema pytest jmespath jinja2
  script:
    - python3 -m pytest tools/validate/ tools/evidence/ -q
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    CI: "true"  # R16 fail-closed when git is missing under CI

sync-drift:
  stage: verify
  script:
    - python3 tools/sync-ide-configs.py --check
    - python3 tools/generate-kiro-agents.py --check
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

install-check:
  stage: verify
  image: bash:5.2
  before_script: []  # override default
  script:
    - bash install.sh --check
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"

schema-validity:
  stage: verify
  script:
    - |
      python3 -c "
      import json, jsonschema
      from pathlib import Path
      failed = 0
      for p in Path('schemas').glob('*.schema.json'):
          try:
              jsonschema.Draft202012Validator.check_schema(json.load(p.open()))
              print(f'OK  {p.name}')
          except Exception as e:
              print(f'FAIL {p.name}: {e}')
              failed += 1
      exit(failed)
      "
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"

shellcheck:
  stage: verify
  image: koalaman/shellcheck-alpine:stable
  before_script: []
  script:
    # Shipped scripts (smoke-deploy-test.sh, install.sh) must lint clean
    - shellcheck scripts/smoke-deploy-test.sh
    - shellcheck install.sh
    - shellcheck .githooks/pre-commit
    - shellcheck .githooks/post-merge
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == "main"
