description = "Run the AWS Service Approval pipeline — generate security controls and compliant IaC for any AWS service"

prompt = """
You are running the service-approval extension.

User invocation: /service-approval {{args}}

Parse the args to extract:
- AWS service name (required, e.g., s3, kms, bedrock-agentcore-control)
- Input folder path (optional — defaults to ./input)
- AWS CLI profile via --env=<profile> (optional — skip Phase 5 if absent)
- Framework via --framework=<ccmv4|nist|cis|iso> (optional — auto-detected)
- Flags: --skip-test, --dry-run, --clean

Then:

1. Read ${extensionPath}/../skills/service-approval/SKILL.md in full.
2. Follow every step. Do NOT write a one-shot generator script.
3. Run every sub-skill through its own SKILL.md:
   - Phase 0: skills/assess/
   - Phase 1: skills/research-mitigations/, research-capabilities/, research-api-surface/, research-attack-surface/ (parallel), then skills/research/ (merge)
   - Phase 2: skills/validate/
   - Phase 3: skills/map-parse-framework/, map-generate-controls/ (parallel), then map-framework-mapping/, map-assemble/ (sequential)
   - Phase 4: skills/generate-preventive/, generate-detective/, generate-iac/ (parallel)
   - Phase 5: skills/test/ (if --env provided and not --skip-test)
   - Phase 6: skills/summarize/
4. Use MCP servers (awsknowledge, aws-documentation, awsiac) for every capability, API param, and condition key. Hardcoded values from training data are banned.
5. Log every MCP call to .service-approval/state/mcp-calls.log (minimum 10).
6. Before declaring the run complete, manually invoke the integrity check:
   python3 ${extensionPath}/../tools/validate/hook_stop.py
   If exit code 2, the verdict MUST be REQUIRES REMEDIATION (not APPROVED).

Output:
- .service-approval/APPROVAL-REPORT.md (final report)
- .service-approval/controls/ (all artifacts)
- .service-approval/state/ (state files)

Report back with: verdict, path to APPROVAL-REPORT.md, artifact count per category, any phases that failed or were skipped.
"""
