body: |
  Follow the instructions in `skills/generate-iac/SKILL.md`.

  Read the skill file, consume `.service-approval/<slug>/04-map/mapping-results.json` and `.service-approval/<slug>/03-validate/validated.json`, and write outputs to `.service-approval/<slug>/05-generate/iac/` in 4 formats: Terraform (modular), CloudFormation YAML, CDK TypeScript, and CDKTF.
