name: sa-generate-iac
description: "Generate compliant IaC templates in Terraform, CloudFormation, CDK TypeScript, and CDKTF"
skill: generate-iac
phase: 4
parallel_group: generate
optional: false
mcp_servers:
  - aws-documentation
  - awsknowledge
  - awsiac
  - terraform
body: |
  > **DRAFT OUTPUT NOTICE**
  > Outputs generated by this accelerator are not production ready. All generated artifacts require thorough review by your security, risk, or equivalent teams before deployment. No regulatory, legal, or compliance advice is provided, and no liability is assumed for its output. Compliance and production readiness remain your responsibility. Ensure alignment with your organization's policies and AWS service terms.
  >
  > Every output file MUST:
  > 1. Use a `-DRAFT` filename suffix (e.g., `main-DRAFT.tf`, `stack-DRAFT.yaml`, `app-DRAFT.ts`)
  > 2. Embed the disclaimer text in the file header (as a comment for HCL/YAML/TypeScript files, as `_metadata.draft_disclaimer` for JSON files)

  Follow the instructions in `skills/generate-iac/SKILL.md`.

  Read the skill file, consume `.service-approval/<slug>/04-map/mapping-results.json` and `.service-approval/<slug>/03-validate/validated.json`, and write outputs to `.service-approval/<slug>/05-generate-DRAFT/iac-DRAFT/` in 4 formats: Terraform (modular), CloudFormation YAML, CDK TypeScript, and CDKTF.
